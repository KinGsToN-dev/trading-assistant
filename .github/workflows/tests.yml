name: Backend Tests (pytest)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trading_assistant_test
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: 'False'
      DATABASE_URL: postgresql://trading_user:test_password@localhost:5432/trading_assistant_test
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      MT5_API_TOKEN: test-mt5-token
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CHAT_ID: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations (sanity)
        working-directory: ./backend
        run: python manage.py migrate --noinput

      - name: Run pytest
        working-directory: ./backend
        run: python -m pytest -v --tb=short